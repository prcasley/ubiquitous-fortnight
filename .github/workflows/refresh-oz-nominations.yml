name: Refresh official state nomination evidence
on:
  schedule:
    - cron: '17 11 * * 1' # Mondays, 11:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-oz-nominations.yml'
      - 'scripts/build-nj-oz-nominations.py'
      - 'tests/test_oz_nomination_refresh.py'
      - 'tests/test_nj_oz_release_coverage.py'
      - 'scripts/check-fl-oz-eligibility.py'
      - 'scripts/build-fl-oz-eligibility.py'
      - 'tests/test_fl_oz_refresh.py'
      - 'tests/test_fl_oz_eligibility_check.py'
      - 'tests/data/nj-oz-release-20261029.json'
permissions:
  contents: read
concurrency:
  group: refresh-oz-nominations
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test refresh integrity and failure handling
        run: python -m unittest discover -s tests -p 'test_oz_nomination_refresh.py'
      - name: Retrieve and validate NJ state nominations
        run: python scripts/build-nj-oz-nominations.py
      # Blocks the commit if refreshed evidence drops or misfiles any tract,
      # county or municipality announced in the Oct 29, 2026 NJ DCA release.
      - name: Confirm every announced NJ municipality remains mapped
        run: python -m unittest discover -s tests -p 'test_nj_oz_release_coverage.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh geometry-based NJ legacy comparison
        id: round_comparison
        continue-on-error: true
        run: node scripts/build-nj-oz-round-comparison.mjs
      - name: Report unavailable legacy comparison
        if: steps.round_comparison.outcome == 'failure'
        run: echo '::warning::Legacy reference comparison was not renewed. Prior dated files retained; expired comparisons stay unavailable. Official nominations may still refresh.'
      - name: Validate refreshed evidence and public build
        # Build first: the private-API test serves files from dist/ and fails
        # with 404 on a fresh checkout if tests run before the build.
        run: |
          npm run build
          npm test
      - name: Commit changed or renewed evidence only
        id: commit
        run: |
          file=assets/data/oz-designation-evidence.json
          if git diff --quiet -- "$file" assets/data/nj-oz-round-comparison.json assets/data/nj-oz-round-comparison.csv; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file" assets/data/nj-oz-round-comparison.json assets/data/nj-oz-round-comparison.csv
          git commit -m 'Refresh verified NJ state-nomination evidence'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger push workflows. Explicitly invoke
      # the existing publication workflow, including every registered browser suite.
      - name: Validate and publish refreshed site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-build.yml --ref main
  # Validate live FloridaCommerce layers and renew the dated public eligibility snapshot if the
  # state changes the layers, e.g. replacing eligibility with nominations or a new round.
  florida-eligibility:
    needs: refresh
    if: always() && !cancelled()
    permissions:
      contents: write
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test FloridaCommerce guard logic
        run: python -m unittest discover -s tests -p 'test_fl_oz_eligibility_check.py'
      - name: Verify live FloridaCommerce eligibility layers
        run: python scripts/check-fl-oz-eligibility.py
      - name: Refresh dated Florida eligibility evidence
        run: python scripts/build-fl-oz-eligibility.py
      - name: Validate Florida evidence renewal rules
        run: python -m unittest discover -s tests -p 'test_fl_oz_refresh.py'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit only changed or renewed Florida eligibility evidence
        id: fl_commit
        run: |
          file=assets/data/fl-oz-eligibility.json
          if git diff --quiet -- "$file"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$file"
          git commit -m 'Refresh FloridaCommerce eligibility evidence'
          git push origin HEAD:main
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Validate and publish refreshed Florida evidence
        if: steps.fl_commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-build.yml --ref main
