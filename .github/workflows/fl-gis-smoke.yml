name: Florida GIS connectivity diagnosis
on:
  pull_request:
    paths:
      - scripts/fl-public-probe.mjs
      - .github/workflows/fl-gis-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  florida-public-query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check authoritative Florida GIS queries
        run: node scripts/fl-public-probe.mjs
