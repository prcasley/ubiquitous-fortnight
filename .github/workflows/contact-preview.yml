name: Contact alternative preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test tests/contact-evidence.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: contact-alternative-preview
          path: dist/
