name: Public Radar static QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Validate public data contracts and agent
        run: |
          node --check assets/radar-live.js
          node --check assets/radar-geo.js
          node --check assets/radar-agent.js
          node --check assets/radar-assistant.js
          node --check server/hosted-assistant.mjs
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser-smoke.py
      - run: python tests/executive-browser.py
      - run: python tests/ceo-browser.py

      - run: python tests/sprint1-browser.py
      - run: python tests/acquisition-browser.py
      - run: python tests/deal-nav-browser.py
      - run: python tests/easton-browser.py
      - run: python tests/executive-entry-browser.py
      - run: python tests/archive-browser.py
      - run: python tests/reliability-browser.py
      - run: python tests/kml-oz-browser.py
