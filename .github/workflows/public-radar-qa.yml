name: Public Radar static QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate public data contracts and agent
        run: |
          node --check assets/radar-live.js
          node --check assets/radar-geo.js
          node --check assets/radar-agent.js
          node --check assets/radar-nemotron-browser.js
          node --check assets/nemotron-local-worker.mjs
          node --test tests/public-gis.test.mjs
