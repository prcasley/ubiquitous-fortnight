name: Public Radar static QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  static-public-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Validate public data contracts and agent
        run: |
          node --check assets/radar-live.js
          node --check assets/radar-geo.js
          node --check assets/radar-agent.js
          node --check assets/radar-assistant.js
          node --check server/hosted-assistant.mjs
          npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tests/test_browser_runner.py
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Run every public browser suite
        run: python scripts/run-browser-tests.py
        env:
          RADAR_USE_MANAGED_CHROMIUM: '1'
      - name: Preserve browser results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-results
          path: test-results/browser
          if-no-files-found: ignore
