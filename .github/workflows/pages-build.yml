name: Build and publish public static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    timeout-minutes: 15
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify public executive workflows before publication
        run: |
          python tests/browser-smoke.py
          python tests/executive-browser.py
          python tests/ceo-browser.py
          python tests/sprint1-browser.py
          python tests/acquisition-browser.py
          python tests/deal-nav-browser.py
          python tests/easton-browser.py
          python tests/executive-entry-browser.py
          python tests/kml-oz-browser.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
