name: Build and publish public static site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    timeout-minutes: 20
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify public executive workflows before publication
        run: python scripts/run-browser-tests.py
        env:
          RADAR_USE_MANAGED_CHROMIUM: '1'
      - name: Preserve browser results and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publish-browser-results
          path: test-results/browser
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4
